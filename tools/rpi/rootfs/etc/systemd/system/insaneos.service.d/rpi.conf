# Raspberry Pi: before insane-sessiond, wait for vc4 (HDMI) to appear in /sys/class/drm. On the
# Pi 5, v3d can end up as card0 with no connectors, and if insane-sessiond starts before vc4 is
# loaded it does not find the display (server/src/drmcard.h). See docs/RASPBERRY.md.
[Unit]
After=insaneos-rpi-firstboot.service
Wants=insaneos-rpi-firstboot.service

[Service]
# the list is reset so the boot splash hand-off (insaneos-splash deactivate) stays the last step,
# after vc4 is there
ExecStartPre=
ExecStartPre=-/usr/lib/insaneos/insaneos-live-prep
ExecStartPre=-/usr/lib/insaneos/rpi/wait-kms
ExecStartPre=-/usr/lib/insaneos/insaneos-splash deactivate
